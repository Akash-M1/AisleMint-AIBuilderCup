name: aibuildercup
services:
  web:
    image: ${DEMO_FRONTEND_IMAGE:?Supply immutable frontend image}
    restart: unless-stopped
    init: true
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    networks:
      product-router:
        aliases: [aibuildercup-web]
    healthcheck:
      test: [CMD,node,-e,"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 6
networks:
  product-router:
    external: true
    name: aislemint_default
