steps:
- name: gcr.io/cloud-builders/docker
  id: api
  args: ['build', '-f', 'hackathon/Dockerfile.api', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/aislemint/aibuildercup-api:$BUILD_ID', '.']
  waitFor: ['-']
- name: gcr.io/cloud-builders/docker
  id: frontend
  args: ['build', '-f', 'hackathon/Dockerfile.frontend', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/aislemint/aibuildercup-web:$BUILD_ID', '.']
  waitFor: ['-']
images:
- us-central1-docker.pkg.dev/$PROJECT_ID/aislemint/aibuildercup-api:$BUILD_ID
- us-central1-docker.pkg.dev/$PROJECT_ID/aislemint/aibuildercup-web:$BUILD_ID
timeout: 1200s
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
