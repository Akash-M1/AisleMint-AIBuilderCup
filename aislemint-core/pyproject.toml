[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aislemint-core"
version = "0.4.0"
description = "Shared runtime, persistence, UI foundations and gateway"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]
namespaces = true

[tool.setuptools.package-data]
promo = ["*.json"]
